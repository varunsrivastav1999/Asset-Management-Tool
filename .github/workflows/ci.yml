name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asset
          POSTGRES_PASSWORD: asset
          POSTGRES_DB: asset_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asset" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://asset:asset@localhost:5432/asset_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check apps config tests
          ruff format --check apps config tests
      - name: Migrations are up to date
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py makemigrations --check --dry-run
      - name: Deploy checks
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.prod \
          DJANGO_SECRET_KEY=ci-only-secret-key-that-is-long-enough-0123456789abcdef \
          DJANGO_ALLOWED_HOSTS=example.com \
          python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: pytest --create-db --cov --cov-report=term --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: asset-mgmt/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: asset-mgmt/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
