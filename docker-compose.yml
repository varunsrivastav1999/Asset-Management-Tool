# One command, no manual steps:   docker compose up --build
#   App (nginx: SPA + reverse proxy)          -> https://localhost:2025 (or https://<this machine's LAN IP>:2025)
#   Backend (Django API + Channels, ASGI)    -> http://127.0.0.1:2000 (localhost only; use nginx publicly)
# The api container migrates and seeds defaults (menu, tables, columns, widgets, reminder rules). On a fresh
# database it creates the first admin: admin@gmail.com / admin unless ADMIN_EMAIL / ADMIN_PASSWORD are set;
# the app then asks for a new password. The backup service keeps daily database backups.
# .env is optional — see .env.example for production settings.
name: asset-mgmt

x-backend: &backend
  build:
    context: ./backend
  image: asset-mgmt/backend:${APP_VERSION:-latest}
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-asset}:${POSTGRES_PASSWORD:-asset_local_only}@postgres:5432/${POSTGRES_DB:-asset}
    REDIS_URL: redis://redis:6379
    BACKEND_PORT: "2000"
    FRONTEND_URL: ${FRONTEND_URL:-}  # empty = links use the address each user opened the app on
    ALLOW_PRIVATE_NETWORK_HOSTS: ${ALLOW_PRIVATE_NETWORK_HOSTS:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:2025,http://127.0.0.1:2025}
    # Same switch as nginx: with HTTPS on (default) Django redirects to HTTPS and marks cookies Secure.
    HTTPS: ${HTTPS:-auto}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    ASGI_SERVER: ${ASGI_SERVER:-gunicorn}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
    MALLOC_ARENA_MAX: "2"
    BACKUP_DIR: /data/backups  # shared with the backup service
    BACKUP_TIME: ${BACKUP_TIME:-02:00}
    BACKUP_KEEP: ${BACKUP_KEEP:-7}
  volumes:
    - media:/data/media
    - private_media:/data/private
    - backups:/data/backups
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset}
      POSTGRES_USER: ${POSTGRES_USER:-asset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset_local_only}
    # Tuned for a small box; the database is only reachable on the internal Docker network.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 320m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", ""]
    volumes: [redisdata:/data]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      # First run only (fresh database): sign in with these, then change the password when prompted.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-admin}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-2000}:2000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2000/api/health/ready/', timeout=4)"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5

  worker:
    <<: *backend
    command: ["worker"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 40s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["beat"]
    mem_limit: 192m
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  # Database backups: daily automatic (kept BACKUP_KEEP days) + on demand from Settings -> Backups.
  # Restore: see README ("Backups"). Files live in the `backups` volume.
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    command: ["run"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-asset}
      PGUSER: ${POSTGRES_USER:-asset}
      PGPASSWORD: ${POSTGRES_PASSWORD:-asset_local_only}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      TZ: ${TIME_ZONE:-UTC}
      APP_UID: "1000"
    volumes:
      - backups:/backups
      - ./backup:/scripts:ro
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }  # migrations done, so the first backup has the full schema
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Asset Management Tools}
    image: asset-mgmt/web:${APP_VERSION:-latest}
    environment:
      # auto: HTTPS with nginx/certs/*.pem if present, else a self-signed certificate (needed for phone cameras).
      HTTPS: ${HTTPS:-auto}
      TLS_HOSTS: ${TLS_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-2025}:2025"
    volumes:
      - media:/data/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/admin-auth:/etc/nginx/admin-auth:ro
      - nginx_tls:/var/lib/nginx/tls
    mem_limit: 64m
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  backups:
  nginx_tls:
  redisdata:
  media:
  private_media:
