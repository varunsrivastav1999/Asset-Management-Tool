# Django admin is a break-glass tool: reachable only from trusted networks.
# Edit this allowlist for your environment (office/VPN ranges), then rebuild or restart nginx.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;   # Docker bridge networks (host -> container traffic)
allow 192.168.0.0/16;
deny all;

# Optional basic auth: drop a *.conf file into nginx/admin-auth/ (see README there).
include /etc/nginx/admin-auth/*.conf;
