# Shared locations for the HTTP and HTTPS server blocks.
root /usr/share/nginx/html;

location = /api/auth/login/ {
  limit_req zone=auth burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://api;
}

location /api/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://api;
}

location /admin/ {
  include /etc/nginx/snippets/admin-access.conf;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://api;
}

location /static/ {
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://api;   # whitenoise serves hashed, compressed admin/DRF assets
}

location /ws/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_pass http://api;
}

# Public media (asset photos, avatars). Signatures live in a private volume that is never mounted here.
location /media/ {
  alias /data/media/;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
  expires 30d;
  access_log off;
}

location /_app/ {
  include /etc/nginx/snippets/security-headers.conf;
  expires 1y;
  add_header Cache-Control "public, immutable" always;
  try_files $uri =404;
}

location = /manifest.webmanifest {
  include /etc/nginx/snippets/security-headers.conf;
  types { }
  default_type application/manifest+json;
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

location = /sw.js {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

location = /nginx-health {
  access_log off;
  return 200 "ok\n";
}

location / {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ /index.html;
}
