# Plain-HTTP server block, used for the build-time config check and when HTTPS=off.
# At start-up nginx/docker-entrypoint.sh replaces this file with the HTTPS block unless HTTPS=off.
map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }

server {
  listen 2025 default_server;
  server_name _;
  include /etc/nginx/snippets/app.conf;
}
