load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes 1;  # one worker is plenty for a small team and keeps RAM low; raise for heavy traffic
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Run as non-root: keep temp paths writable.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"ua":"$http_user_agent","rid":"$request_id"}';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv application/json application/javascript application/xml image/svg+xml application/manifest+json;

  brotli on;
  brotli_static on;
  brotli_comp_level 5;
  brotli_min_length 1024;
  brotli_types text/plain text/css text/csv application/json application/javascript application/xml image/svg+xml application/manifest+json;

  # Basic abuse protection; DRF throttles add per-user limits behind this.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Django (DRF + Channels) on one ASGI port.
  upstream api { server api:2000; keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
